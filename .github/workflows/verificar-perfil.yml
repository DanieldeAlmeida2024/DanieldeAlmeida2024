name: Verificar README do perfil e badges AWS
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  qualidade:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Garantir integridade do perfil público
        run: python -m unittest discover -s tests -p 'test_*.py' -v
